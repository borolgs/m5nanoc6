[package]
edition = "2024"
license = "MIT"
name = "m5nanoc6"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "m5nanoc6"
path = "./src/bin/main.rs"

[dependencies]
log = "0.4.33"

esp-hal = { version = "~1.1.0", features = ["esp32c6", "unstable", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6"] }
esp-radio = { version = "0.18.0", features = ["esp-alloc", "esp32c6", "unstable", "wifi"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-alloc = "0.10.0"

esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }

embedded-io = "0.7.1"
embedded-io-async = "0.7.0"

bosch-bme680 = { version = "1.0.4", features = ["embedded-hal-async"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

critical-section = "1.2.0"
static_cell = "2.1.1"

# Not used here directly: `embedded-tls` 0.18 was written against `der 0.8.0-rc.2`, where
# `SequenceOf`/`SetOf` were unconditional. In released `der` they sit behind `heapless`, and
# only a direct dependency can turn that feature on for the whole graph.
der = { version = "0.8.1", default-features = false, features = ["heapless"] }
reqwless = { version = "=0.14.0", default-features = false, features = ["embedded-tls", "log"] }

# Host-side only: `build.rs` feeds `.env` to the compiler.
[build-dependencies]
dotenvy = "0.15.7"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2 # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
